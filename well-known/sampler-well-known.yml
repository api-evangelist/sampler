note: >-
  NO HIT. Not one /.well-known/ path returned a document, because no sampler.io host
  is reachable at all. The apex and www hosts fail the TLS handshake outright
  (TLSV1_ALERT_INTERNAL_ERROR, reproduced from three independent SSL stacks:
  LibreSSL 3.3.6, OpenSSL 3.6.2, and the WebFetch edge), so no HTTP request is ever
  sent. The api host still has stale DNS A records pointing at AWS EC2 addresses
  whose ports 80 and 443 are all closed/filtered. Every other developer-shaped
  subdomain is NXDOMAIN. Sampler (The Sampler App Inc., Toronto) filed for
  bankruptcy on 2024-06-27 and ceased operations; this is a decommissioned estate,
  not a misconfiguration. Per the enrichment contract NO WellKnown or SecurityTxt
  pointer is emitted in apis.yml — this file records a verified ABSENCE, and an
  absence must never be wired as a presence.
