    Archived crawls confirm the absence predates the shutdown, so this was never a
    served surface. On 2024-02-01, while the site was still up, www.sampler.io
    returned 404 for /.well-known/security.txt, /openid-configuration and
    /ai-plugin.json. A 2023-06-15 crawl of app.sampler.io shows HTTP 200 for EVERY
    /.well-known/ path probed — including nodeinfo, gpc.json, trust.txt and
    assetlinks.json — which is the SPA catch-all false positive, not eight served
    documents. It is recorded here as a miss.
