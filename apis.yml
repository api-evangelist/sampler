name: Sampler
description: 'Sampler (The Sampler App Inc., Toronto) was a digital product-sampling platform used
  by consumer packaged goods (CPG) and retail brands to run targeted sample-distribution campaigns,
  collect first-party consumer data and reviews, and measure the impact of sampling on purchase
  behavior. Founded in 2013, it acquired Abeo and AdMass in 2023 and served brands including
  Procter & Gamble, Unilever, L''Oreal, Nestle and PepsiCo. THE COMPANY IS DEFUNCT: it filed for
  bankruptcy on 2024-06-27 with CAD 12.9M in liabilities against roughly CAD 300K in assets, and
  ceased operations. As of 2026-08-12 the entire estate is decommissioned — sampler.io and
  www.sampler.io fail the TLS handshake outright, api.sampler.io retains stale DNS records whose
  hosts refuse all connections, and every documentation or developer subdomain is NXDOMAIN. Sampler
  never published a public developer API, developer portal, documentation host, OpenAPI, or machine
  discovery surface; the api.sampler.io/v1/ endpoints visible in archived crawls were the private
  backend of its consumer claim widget and admin console, not a documented developer product.'
